[workspace]
resolver = "3"
members = ["home-core", "dekave", "akramium-home"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
rust-version = "1.95"
repository = "https://github.com/Saidoua/akramium-home"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.dependencies]
home-core = { path = "home-core" }
dekave = { path = "dekave" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "time", "sync"] }
axum = { version = "0.8", features = ["http1", "json", "query", "tokio"] }
tower-http = { version = "0.6", features = ["fs", "limit", "set-header", "trace"] }
tower = "0.5"
http = "1"
http-body-util = "0.1"
futures-util = { version = "0.3", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
argon2 = "0.6"
rand = "0.9"
sha2 = "0.10"
base64 = "0.22"
blake3 = "1"
bytes = "1"
dav-server = { version = "0.11", default-features = false }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
mime_guess = "2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp", "gif"] }
tempfile = "3"
ureq = { version = "3", features = ["json"] }

[profile.release]
lto = "fat"
codegen-units = 1
strip = true
