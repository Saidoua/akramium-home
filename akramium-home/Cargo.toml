[package]
name = "akramium-home"
description = "Akramium Home: one daemon for the household's drive, docs and mail"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true

[lints]
workspace = true

[lib]
name = "akramium_home"
path = "src/lib.rs"

[[bin]]
name = "akramium-home"
path = "src/main.rs"

[dependencies]
home-core.workspace = true
dekave.workspace = true
tokio.workspace = true
axum.workspace = true
tower-http.workspace = true
http.workspace = true
serde.workspace = true
serde_json.workspace = true
tracing.workspace = true
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
rustls = { version = "0.23.45", default-features = false, features = ["ring", "std", "tls12"] }

[dev-dependencies]
tempfile.workspace = true
http.workspace = true
serde_json.workspace = true
